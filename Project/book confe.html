<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Venues</title>

<style>
body {
    margin:0;
    font-family:system-ui;
    background:#0b1220;
    color:#e5e7eb;
}

.header {
    padding:20px;
    background:#0f172a;
    position:sticky;
    top:0;
}

.container {
    padding:50px;
    display:flex;
    flex-direction:column;
    gap:30px;
}

.venue {
    display:flex;
    gap:25px;
    background:#0f172a;
    border:1px solid #1f2937;
    padding:20px;
    border-radius:15px;
}

.image-box { width:40%; }
img { width:100%; height:250px; object-fit:cover; border-radius:10px; }

.details { width:60%; }

button {
    padding:10px;
    background:#4f46e5;
    border:none;
    color:white;
    border-radius:8px;
}

.modal {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:#0f172a;
    padding:20px;
    border-radius:10px;
    width:400px;
}

input, select, textarea {
    width:100%;
    margin:5px 0;
    padding:8px;
    background:#0b1220;
    color:white;
    border:1px solid #1f2937;
}
</style>
</head>

<body>

<header class="header">Conference Venues</header>

<div class="container">

<div class="venue">
    <div class="image-box"><img src="c1.jpg"></div>
    <div class="details">
        <h2>Summit Ridge Hall</h2>
        <button onclick="openModal('Conference')">Book Now</button>
    </div>
</div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<h3 id="title"></h3>

<input type="number" placeholder="Attendees">
<select><option>Basic</option><option>Premium</option></select>
<input type="date">
<textarea placeholder="AV Package"></textarea>
<textarea placeholder="Amenities"></textarea>

<button>Confirm</button>
</div>
</div>

<script>
function openModal(type){
    document.getElementById("modal").style.display="flex";
    document.getElementById("title").innerText="Book "+type;
}
window.onclick=e=>{
    if(e.target.id==="modal"){
        document.getElementById("modal").style.display="none";
    }
}
</script>

</body>
</html>
